<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floraligue 1</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#081321;color:#fff;font-family:Arial,sans-serif}
header{background:#102944;padding:25px;text-align:center;border-bottom:3px solid #328cff}
h1{margin:0;font-size:30px}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:15px;background:#0c1d31}
button{background:#287cf0;color:white;border:0;border-radius:9px;padding:11px 15px;font-weight:bold;cursor:pointer}
main{max-width:1000px;margin:auto;padding:18px}
.hero{background:linear-gradient(120deg,#12457b,#101c32);padding:28px;border-radius:16px}
.card{background:#13243a;border:1px solid #29425f;border-radius:12px;padding:15px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.club{cursor:pointer}
.logo{display:inline-block;background:#286be0;padding:12px;border-radius:50%;margin-right:8px}
.match{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #30445d;padding:13px 0}
.score{font-weight:bold;color:#5de3ae}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:10px 6px;text-align:left;border-bottom:1px solid #30445d}
.tablewrap{overflow-x:auto}
input,select{width:100%;padding:12px;background:#09192a;border:1px solid #48627e;border-radius:8px;color:white;margin:8px 0 15px}
label{display:block;margin-top:10px}
.error{background:#58202b;padding:15px;border-radius:10px}
footer{text-align:center;padding:25px;color:#8fa8c5}
</style>
</head>
<body>
<header>
<h1>⚽ FLORALIGUE 1</h1>
<p>Le championnat de la Floraligue</p>
</header>
<nav>
<button onclick="show('home')">Accueil</button>
<button onclick="show('clubs')">Clubs</button>
<button onclick="show('matches')">Matchs</button>
<button onclick="show('table')">Classement</button>
<button onclick="show('admin')">🔐 Admin</button>
</nav>
<main id="app">Chargement...</main>
<footer>Floraligue 1 • Championnat fictif</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL_DB="https://gyfkukllzsyefckdmjte.supabase.co";
const PUBLIC_KEY="sb_publishable_XQMiBUn5hSK3kj2lIVYwTg_pBSbla91";
const db=window.supabase.createClient(URL_DB,PUBLIC_KEY);
let clubs=[],players=[],matches=[],ranking=[];
let current="home";
const app=document.getElementById("app");

function esc(s){
return String(s??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#39;"
}[c]));
}
function name(id){
return clubs.find(c=>String(c.id)===String(id))?.name||"Club";
}
function show(page){
current=page;
render();
window.scrollTo(0,0);
}
async function load(){
try{
const results=await Promise.all([
db.from("clubs").select("*"),
db.from("players").select("*"),
db.from("matches").select("*"),
db.from("classement").select("*")
]);
for(const r of results)if(r.error)throw r.error;
[clubs,players,matches,ranking]=results.map(r=>r.data||[]);
ranking.sort((a,b)=>(b.points||0)-(a.points||0)||(b.difference_buts||0)-(a.difference_buts||0));
render();
}catch(e){
app.innerHTML='<div class="error">Erreur de connexion : '+esc(e.message)+'</div>';
}
}
function clubCards(){
return '<div class="grid">'+clubs.map(c=>`
<div class="card club" onclick="clubDetail('${esc(c.id)}')">
<span class="logo">⚽</span><b>${esc(c.name)}</b>
<p>Voir les joueurs →</p>
</div>`).join("")+"</div>";
}
function render(){
if(current==="home"){
app.innerHTML=`
<div class="hero">
<h2>Bienvenue en Floraligue 1</h2>
<p>Le championnat de tes 18 clubs !</p>
</div>
<div class="grid">
<div class="card"><h2>${clubs.length}</h2>Clubs</div>
<div class="card"><h2>${players.length}</h2>Joueurs</div>
<div class="card"><h2>${matches.filter(m=>m.played).length}</h2>Matchs joués</div>
</div>
<h2>Les clubs</h2>${clubCards()}`;
}
if(current==="clubs"){
app.innerHTML="<h2>Les clubs</h2>"+clubCards();
}
if(current==="matches"){
app.innerHTML=`
<h2>Matchs et résultats</h2>
<div class="card">
${matches.map(m=>`
<div class="match">
<span>${esc(name(m.home_club_id))}</span>
<span class="score">${m.played?esc(m.home_score)+" - "+esc(m.away_score):"À jouer"}</span>
<span>${esc(name(m.away_club_id))}</span>
</div>`).join("")}
</div>`;
}
if(current==="table"){
app.innerHTML=`
<h2>Classement</h2>
<div class="card tablewrap">
<table>
<tr><th>#</th><th>Club</th><th>MJ</th><th>V</th><th>N</th><th>D</th><th>Diff.</th><th>Pts</th></tr>
${ranking.map((r,i)=>`
<tr>
<td>${i+1}</td>
<td>${esc(r.club)}</td>
<td>${r.matchs_joues||0}</td>
<td>${r.victoires||0}</td>
<td>${r.nuls||0}</td>
<td>${r.defaites||0}</td>
<td>${r.difference_buts||0}</td>
<td><b>${r.points||0}</b></td>
</tr>`).join("")}
</table></div>`;
}
if(current==="admin")admin();
}
function clubDetail(id){
const c=clubs.find(x=>String(x.id)===String(id));
if(!c)return;
const ps=players.filter(p=>String(p.club_id)===String(id));
app.innerHTML=`
<button onclick="show('clubs')">← Retour</button>
<h2>${esc(c.name)}</h2>
<h3>Joueurs (${ps.length})</h3>
<div class="grid">
${ps.map(p=>`<div class="card">${esc(p.name)}</div>`).join("")}
</div>`;
}
async function admin(){
app.innerHTML='<div class="card">Vérification...</div>';
const {data:{session}}=await db.auth.getSession();
if(!session){
app.innerHTML=`
<h2>🔐 Administration</h2>
<div class="card">
<p>Connexion réservée à l'administrateur.</p>
<label>E-mail</label>
<input id="email" type="email">
<label>Mot de passe</label>
<input id="password" type="password">
<button onclick="login()">Se connecter</button>
</div>`;
return;
}
const {data:{user}}=await db.auth.getUser();
if(!user){await db.auth.signOut();return admin()}
const {data:a,error}=await db.from("admin_users")
.select("user_id").eq("user_id",user.id).maybeSingle();
if(error||!a){
app.innerHTML='<div class="error">Compte non autorisé.</div><button onclick="logout()">Déconnexion</button>';
return;
}
app.innerHTML=`
<h2>Administration des scores</h2>
<div class="card">
<p>✅ Compte administrateur connecté</p>
<label>Match</label>
<select id="match">
${matches.map(m=>`
<option value="${esc(m.id)}">${esc(name(m.home_club_id))} - ${esc(name(m.away_club_id))}</option>`).join("")}
</select>
<label>Buts domicile</label>
<input type="number" id="home" min="0" value="0">
<label>Buts extérieur</label>
<input type="number" id="away" min="0" value="0">
<button onclick="saveScore()">Enregistrer le score</button>
<button onclick="logout()">Déconnexion</button>
</div>`;
}
async function login(){
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
const {error}=await db.auth.signInWithPassword({email,password});
if(error)alert("Erreur : "+error.message);
else admin();
}
async function logout(){
await db.auth.signOut();
admin();
}
async function saveScore(){
const id=document.getElementById("match").value;
const h=Number(document.getElementById("home").value);
const a=Number(document.getElementById("away").value);
if(!Number.isInteger(h)||!Number.isInteger(a)||h<0||a<0){
alert("Scores invalides");
return;
}
const {error}=await db.from("matches")
.update({home_score:h,away_score:a,played:true}).eq("id",id);
if(error){alert("Erreur : "+error.message);return;}
alert("Score enregistré !");
await load();
}
load();
</script>
</body>
</html>
