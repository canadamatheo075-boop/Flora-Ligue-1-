function crest(i,small=false){return `<span class="${small?'mini':'crest'}">${logos[i]?`<img src="${logos[i]}" alt="Logo ${clubs[i]}">`:short[i]}</span>`}
function clubCard(i){return `<button class="club" onclick="openClub(${i})">${crest(i)}<span><b>${clubs[i]}</b><div class="muted">20 joueurs</div></span></button>`}
function matchRow(m){return `<div class="match"><div class="teams">${crest(m.home,true)}<span>${clubs[m.home]}<br><span class="badge2">contre ${clubs[m.away]}</span></span>${crest(m.away,true)}</div><div class="time">Journée ${m.round}<br>À venir</div></div>`}
function home(){return `<section class="hero"><div class="eyebrow">LE FOOTBALL, NOTRE LIGUE</div><h2>Bienvenue en<br>Floraligue 1.</h2><p>Retrouve les 18 clubs, les effectifs, les rencontres et le classement officiel du championnat.</p><div class="row"><button class="primary" onclick="go('matches')">Voir les matchs →</button><button class="secondary" onclick="go('clubs')">Explorer les clubs</button></div></section><section class="stats"><div class="stat"><strong>18</strong><span>Clubs</span></div><div class="stat"><strong>360</strong><span>Joueurs enregistrés</span></div><div class="stat"><strong>0</strong><span>Matchs joués</span></div></section><div class="head"><h3>Clubs</h3><small>18 équipes</small></div><div class="grid">${clubs.slice(0,6).map((_,i)=>clubCard(i)).join('')}</div><div class="head"><h3>Matchs</h3></div><div class="panel">${matches.slice(0,3).map(matchRow).join('')}<button class="secondary" onclick="go('matches')">Tous les matchs</button></div><div class="head"><h3>Classement</h3></div>${table()}</div>`}
function clubList(){return `<div class="head"><h3>Les 18 clubs</h3><small>360 joueurs</small></div><input class="search" placeholder="Rechercher un club" value="${query.replaceAll('"','&quot;')}" oninput="query=this.value;render()"><div class="grid">${clubs.map((c,i)=>c.toLowerCase().includes(query.toLowerCase())?clubCard(i):'').join('')}</div>`}
function clubDetail(i){return `<button class="back" onclick="selected=-1;render()">← Retour aux clubs</button><div class="panel detail"><div class="row">${crest(i)}<div><h2>${clubs[i]}</h2><div class="muted">20 joueurs fictifs · Saison 2026</div></div></div><div class="head"><h3>Effectif</h3><small>20 joueurs</small></div><div class="players">${players[i].map(p=>`<div class="player"><div><b>${p.name}</b><small>${p.pos}</small></div><span class="number">${p.number}</span></div>`).join('')}</div></div>`}
function table(){return `<div class="tablewrap"><table><thead><tr><th>#</th><th>Club</th><th>MJ</th><th>G</th><th>N</th><th>P</th><th>Pts</th></tr></thead><tbody>${clubs.map((c,i)=>`<tr><td>${i+1}</td><td>${c}</td><td>0</td><td>0</td><td>0</td><td>0</td><td class="pts">0</td></tr>`).join('')}</tbody></table></div><p class="notice">Classement initial : aucun résultat n'a encore été saisi.</p>`}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#content').innerHTML=page==='home'?home():page==='clubs'?(selected<0?clubList():clubDetail(selected)):page==='matches'?`<div class="head"><h3>Calendrier des matchs</h3><small>153 rencontres · phase aller</small></div><div class="panel">${matches.map(matchRow).join('')}</div>`:page==='table'?`<div class="head"><h3>Classement</h3></div>${table()}`:`<div class="head"><h3>Profil</h3></div><div class="panel"><h3>Floraligue 1</h3><p>Bienvenue sur le championnat communautaire.</p><p class="notice">Cette version fonctionne sans connexion ni base de données. Les scores ne sont pas encore modifiables en ligne.</p></div>`}
function go(p){page=p;selected=-1;query='';render();window.scrollTo(0,0)}function openClub(i){page='clubs';selected=i;render();window.scrollTo(0,0)}document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));render();
</script></body></html>
